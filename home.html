<header class="container-fluid py-lg-2 py-3 bg-white shadow position-sticky top-0">
  <div class="container">
    <div class="row">
      <figure class="col-lg-6 col-12 text-lg-start text-center mb-0 pb-0">
        <img width="100px" src="https://cdn.brandfetch.io/idNePJhfYL/theme/dark/idWMFDdEID.svg?c=1dxbfHSJFAPEGdCLU4o5B">
      </figure>
      <div class="col-lg-6">
        <div class="btn-outer d-flex gap-3 justify-content-end">
          <button class="btn whatsappbtn"><i class="fa-brands fa-whatsapp"></i> Chat with us</button>
          <button class="btn call "><i class="fa-solid fa-phone"></i> Call Us</button>
        </div>
      </div>
    </div>
  </div>
</header>


<section class="container-fluid py-lg-5 py-sm-4 py-3">
  <div class="container">
    <div class="row justify-content-between">
      <div class="col-lg-6">
        <div class="bannercontent">
          <h1>Career Opportunities in<br> <span> Digital Marketing</span></h1>
          <p>Digital marketing course so good, you only pay-after-placement </p>
          <ul class="m-0 p-0">
            <li class="mb-3"><i class="fa-solid fa-circle-check me-2"></i>Specialization Perfomance Marketing</li>
            <li class="mb-3"><i class="fa-solid fa-circle-check me-2"></i>Min salary of rs 4.5 LPA</li>
            <li class="mb-3"><i class="fa-solid fa-circle-check me-2"></i>50 Seats Only</li>
          </ul>

          <div class="bannercontentbtn d-flex gap-3">
            <button class="demobtn">Book 2 Days Demo</button>
            <button class="downloadbtn d-flex gap-2 align-items-center justify-content-center"> <i
                class="fa-solid fa-download"></i>Download Curriculum</button>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <form action="" class="bannerform shadow-sm">
          <h3>Book Your Free Class Now!</h3>
          <p>2 days of free demo classes without paying in advance!</p>

          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter Your Name">
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Email Address">
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Phone</label>
            <div class="input-group">
            <span class="input-group-text" id="basic-addon1">+91</span>
            <input type="text" class="form-control" placeholder="Enter Your Number">
            </div>
          </div>

          <div class="mb-3">
            <button class="registerbtn">Register Now</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</section>
